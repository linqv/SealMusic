[package]
name = "sealmusic"
version = "0.7.2"
edition = "2024"
description = "Music at the speed of a blink, designed for pure simplicity\nBuilt by [Rodio](https://github.com/RustAudio/rodio) and [Slint UI](https://slint.dev)"
repository = "https://github.com/linqv/SealMusic"

[dependencies]
dark-light = "2"
chrono = "0.4.42"
env_logger = "0.11.8"
home = "0.5.11"
image = "0.25.8"
lofty = "0.24.0"
log = "0.4.28"
rand = "0.9.2"
rayon = "1.11.0"
rfd = "0.15"
rodio = "0.22.2"
serde = { version = "1.0.223", features = ["derive"] }
single-instance = "0.3.3"
slint = { version = "=1.19.0", default-features = false, features = [
    "backend-winit",
    "renderer-skia-software",
    "system-tray",
    "accessibility",
    "compat-1-2",
    "std",
    "unstable-winit-030",
] }
toml = "0.9.5"
open = "5.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.9"
futures-channel = "0.3"
futures-lite = "2"
url = "2"
tempfile = "3"

[build-dependencies]
lucide-slint = "1.61.0"
slint-build = { version = "=1.19.0" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
