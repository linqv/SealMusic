[package]
name = "sealmusic"
version = "0.7.2"
edition = "2024"
description = "Music at the speed of a blink, designed for pure simplicity\nBuilt by [Rodio](https://github.com/RustAudio/rodio) and [Slint UI](https://slint.dev)"
repository = "https://github.com/linqv/SealMusic"

[features]
default = ["pipewire"]
pipewire = ["cpal/pipewire"]

[dependencies]
color-thief = "0.2"
chrono = "0.4.42"
env_logger = "0.11.8"
home = "0.5.11"
image = { version = "0.25.8", default-features = false, features = [
    "png",
    "gif",
    "webp",
    "bmp",
] }
jpeg-decoder = { version = "0.3.2", default-features = false }
lofty = "0.24.0"
log = "0.4.28"
rand = "0.9.2"
rayon = "1.11.0"
rfd = "0.15"
rtrb = "0.3.3"
rodio = { version = "0.23.0", default-features = false, features = [
    "playback",
    "flac",
    "mp3",
    "mp4",
    "vorbis",
    "wav",
] }
serde = { version = "1.0.223", features = ["derive"] }
single-instance = "0.3.3"
slint = { version = "=1.19.0", default-features = false, features = [
    "backend-winit-wayland",
    "raw-window-handle-06",
    "renderer-femtovg",
    "renderer-software",
    "system-tray",
    "accessibility",
    "compat-1-2",
    "std",
] }
toml = "0.9.5"
open = "5.4.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
dark-light = "2"

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22"
cpal = { version = "0.18.2", features = ["pulseaudio"] }
flate2 = "1"
lx-probe = { path = "tools/lx-probe" }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
mpris-server = "0.9"
futures-channel = "0.3"
futures-lite = "2"
url = "2"
tempfile = "3"

[dev-dependencies]
image = { version = "0.25.8", default-features = false, features = ["jpeg"] }

[build-dependencies]
lucide-slint = "1.61.0"
slint-build = { version = "=1.19.0" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.17"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
incremental = false
strip = true
panic = "abort"
