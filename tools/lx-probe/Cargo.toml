[package]
name = "lx-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rquickjs = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
