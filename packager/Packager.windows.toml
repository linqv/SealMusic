# The Windows packaging scripts supply this package version from Cargo.toml at runtime.
product-name = "SealMusic"
name = "SealMusic"
before-packaging-command = "cargo build --release --manifest-path ../Cargo.toml"
formats = ["nsis"]
out-dir = "../target/release"
binaries-dir = "../target/release"
resources = ["DLLs/*.dll"]
authors = ["Jordan Haidee", "linqv"]
identifier = "dev.sealmusic"
copyright = "Copyright © 2025 Zeedle Dev, 2026 SealMusic contributors."

[[binaries]]
path = "sealmusic"
main = true

[nsis]
installer-icon = "../ui/cover.ico"
